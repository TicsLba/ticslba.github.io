plugins { id 'com.android.application' }

android {
    namespace 'cl.antumapu.guardlite'
    compileSdk 35

    defaultConfig {
        applicationId 'cl.antumapu.guardlite'
        minSdk 21
        targetSdk 35
        versionCode 21
        versionName '2.1.0'
    }

    buildTypes {
        release {
            minifyEnabled false
            debuggable false
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_1_8
        targetCompatibility JavaVersion.VERSION_1_8
    }
}
