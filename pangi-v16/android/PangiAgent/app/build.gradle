plugins {
    id 'com.android.application'
}

android {
    namespace 'cl.antumapu.pangi.v16'
    compileSdk 35

    defaultConfig {
        applicationId 'cl.antumapu.pangi.v16'
        minSdk 28
        targetSdk 35
        versionCode 160001
        versionName '16.0.0-alpha1'
    }

    buildTypes {
        release {
            minifyEnabled false
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}
