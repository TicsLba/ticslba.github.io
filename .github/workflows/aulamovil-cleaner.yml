name: AulaMovil Cleaner 9 to 10.1
on:
  push:
    branches: [ "aulamovil-cleaner-9-to-10" ]
    paths:
      - 'AulaMovilCleaner/**'
      - '.github/workflows/aulamovil-cleaner.yml'
  workflow_dispatch:

jobs:
  android:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.10.2'
      - name: Build cleaner
        working-directory: AulaMovilCleaner
        run: gradle --no-daemon :app:assembleRelease
      - uses: actions/upload-artifact@v4
        with:
          name: AulaMovilCleaner-unsigned
          path: AulaMovilCleaner/app/build/outputs/apk/release/app-release-unsigned.apk
          if-no-files-found: error
