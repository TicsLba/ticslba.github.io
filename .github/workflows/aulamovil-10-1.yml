name: Aula Movil 10.1

on:
  push:
    branches: [aulamovil-10-1]
    paths:
      - 'android/AulaControlAgent/**'
      - 'windows/AulaControlTeacher/**'
      - '.github/workflows/aulamovil-10-1.yml'
  workflow_dispatch:

jobs:
  android:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.0.0'
      - name: Prepare institutional logo
        run: |
          mkdir -p android/AulaControlAgent/app/src/main/res/drawable-nodpi
          curl -L --fail --retry 3             "https://dn721602.ca.archive.org/0/items/logos_20211117/color%20transparente.png"             -o android/AulaControlAgent/app/src/main/res/drawable-nodpi/lba_logo.png
      - name: Build Android
        working-directory: android/AulaControlAgent
        run: gradle --no-daemon :app:assembleRelease
      - name: Validate 10.1 contract
        run: |
          grep -q "versionName '10.1.0'" android/AulaControlAgent/app/build.gradle
          grep -q 'MAKE_USER_EPHEMERAL' android/AulaControlAgent/app/src/main/java/cl/antumapu/aulacontrol/SessionUsers.java
          grep -q 'setApplicationHidden(a,PACKAGE,false)' android/AulaControlAgent/app/src/main/java/cl/antumapu/aulacontrol/PlayStoreGuard.java
          grep -q 'DISALLOW_INSTALL_APPS,Core.ROLE_STUDENT' android/AulaControlAgent/app/src/main/java/cl/antumapu/aulacontrol/Managed.java
          grep -q 'Cerrar sesión y eliminar datos temporales' android/AulaControlAgent/app/src/main/java/cl/antumapu/aulacontrol/MainActivity.java
          grep -q 'SET_FPS' android/AulaControlAgent/app/src/main/java/cl/antumapu/aulacontrol/AgentService.java
      - uses: actions/upload-artifact@v4
        with:
          name: AulaMovil-10.1-Android-unsigned
          path: android/AulaControlAgent/app/build/outputs/apk/release/app-release-unsigned.apk
          if-no-files-found: error

  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'
      - name: Publish Windows x64
        shell: pwsh
        run: dotnet publish windows/AulaControlTeacher/AulaControlTeacher.csproj -c Release -r win-x64 --self-contained true -p:PublishSingleFile=true
      - uses: actions/upload-artifact@v4
        with:
          name: AulaMovil-10.1-Windows-x64
          path: windows/AulaControlTeacher/bin/Release/net10.0-windows/win-x64/publish/
          if-no-files-found: error
