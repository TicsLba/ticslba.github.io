name: Aula Movil 7.0 CI

on:
  push:
    branches: [aula-movil-v7-0]
  workflow_dispatch:

jobs:
  android:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: aula-movil-v7-0
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.6.0'
      - name: Build Aula Movil Android
        working-directory: android/AulaControlAgent
        run: gradle --no-daemon :app:assembleDebug :app:assembleRelease
      - uses: actions/upload-artifact@v4
        with:
          name: Aula-Movil-Android-7.0.0
          path: |
            android/AulaControlAgent/app/build/outputs/apk/debug/app-debug.apk
            android/AulaControlAgent/app/build/outputs/apk/release/app-release-unsigned.apk

  windows:
    strategy:
      fail-fast: false
      matrix:
        runtime: [win-x64, win-arm64, win-x86]
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: aula-movil-v7-0
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'
      - name: Publish Aula Movil Windows
        shell: pwsh
        run: |
          dotnet publish .\windows\AulaControlTeacher\AulaControlTeacher.csproj -c Release -r ${{ matrix.runtime }} --self-contained true -p:PublishSingleFile=true -p:IncludeNativeLibrariesForSelfExtract=true -o .\dist\${{ matrix.runtime }}
      - name: Optional Authenticode signing
        shell: pwsh
        env:
          CERT_B64: ${{ secrets.WINDOWS_CODE_SIGN_PFX_BASE64 }}
          CERT_PASS: ${{ secrets.WINDOWS_CODE_SIGN_PASSWORD }}
        run: |
          $exe = '.\dist\${{ matrix.runtime }}\AulaMovilConsole.exe'
          if ([string]::IsNullOrWhiteSpace($env:CERT_B64) -or [string]::IsNullOrWhiteSpace($env:CERT_PASS)) {
            Write-Host "No Windows code-signing certificate configured; EXE remains unsigned."
            exit 0
          }
          [IO.File]::WriteAllBytes('.\windows-signing.pfx',[Convert]::FromBase64String($env:CERT_B64))
          $signtool = Get-ChildItem "${env:ProgramFiles(x86)}\Windows Kits\10\bin" -Filter signtool.exe -Recurse | Sort-Object FullName -Descending | Select-Object -First 1
          if (-not $signtool) { throw 'signtool.exe not found' }
          & $signtool.FullName sign /fd SHA256 /td SHA256 /tr http://timestamp.digicert.com /f .\windows-signing.pfx /p $env:CERT_PASS $exe
          & $signtool.FullName verify /pa /v $exe
          Remove-Item .\windows-signing.pfx -Force
      - uses: actions/upload-artifact@v4
        with:
          name: Aula-Movil-Windows-7.0.0-${{ matrix.runtime }}
          path: dist/${{ matrix.runtime }}/**
