name: Tablet Escolar 3.0 CI

on:
  push:
    branches: [master]
    paths: ['.github/workflows/tablet-escolar-v3-ci.yml']
  workflow_dispatch:

jobs:
  android:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: tablet-escolar-v3
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.6.0'
      - name: Build Tablet Escolar 3.0
        working-directory: android/TabletEscolar3
        run: gradle --no-daemon :app:assembleDebug :app:assembleRelease
      - uses: actions/upload-artifact@v4
        with:
          name: Tablet-Escolar-Android-3.0.0
          path: |
            android/TabletEscolar3/app/build/outputs/apk/debug/app-debug.apk
            android/TabletEscolar3/app/build/outputs/apk/release/app-release-unsigned.apk
