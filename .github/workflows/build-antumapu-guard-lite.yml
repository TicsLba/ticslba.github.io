name: Build Pangi Recovery

on:
  push:
    branches:
      - chatgpt-pangi-recovery
    paths:
      - 'antumapu-guard-lite/**'
      - '.github/workflows/build-antumapu-guard-lite.yml'

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      ANDROID_HOME: /opt/android-sdk
      ANDROID_SDK_ROOT: /opt/android-sdk
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Install Android command line tools
        run: |
          sudo mkdir -p "$ANDROID_HOME/cmdline-tools"
          curl -fL "https://dl.google.com/android/repository/commandlinetools-linux-11076708_latest.zip" -o /tmp/cmdline-tools.zip
          sudo unzip -q /tmp/cmdline-tools.zip -d "$ANDROID_HOME/cmdline-tools"
          sudo mv "$ANDROID_HOME/cmdline-tools/cmdline-tools" "$ANDROID_HOME/cmdline-tools/latest"
          echo "$ANDROID_HOME/cmdline-tools/latest/bin" >> "$GITHUB_PATH"
          echo "$ANDROID_HOME/platform-tools" >> "$GITHUB_PATH"

      - name: Install Android SDK
        run: |
          yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses >/dev/null || true
          sudo "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" "platform-tools" "platforms;android-35" "build-tools;35.0.0"
          sudo chown -R "$USER:$USER" "$ANDROID_HOME"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Build unsigned release APK
        working-directory: antumapu-guard-lite
        run: gradle :app:assembleRelease --stacktrace

      - name: Verify release
        run: |
          "$ANDROID_HOME/build-tools/35.0.0/aapt" dump badging antumapu-guard-lite/app/build/outputs/apk/release/app-release-unsigned.apk | head -30
          sha256sum antumapu-guard-lite/app/build/outputs/apk/release/app-release-unsigned.apk

      - name: Rename APK
        run: cp antumapu-guard-lite/app/build/outputs/apk/release/app-release-unsigned.apk Pangi-2.2.1-recovery-unsigned.apk

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: Pangi-2.2.1-Recovery-Unsigned
          path: Pangi-2.2.1-recovery-unsigned.apk
          retention-days: 7
