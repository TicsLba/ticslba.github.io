name: Tablet Escolar 5.4 Android

on:
  push:
    branches: [tablet-escolar-v5-4]
    paths:
      - 'android/AulaControlAgent/**'
      - '.github/workflows/tablet-escolar-v5-4.yml'
  workflow_dispatch:

jobs:
  android:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.6.0'
      - name: Build Android APKs
        working-directory: android/AulaControlAgent
        run: gradle --no-daemon :app:assembleDebug :app:assembleRelease
      - name: Verify 5.4 protected Play Store policy
        run: |
          grep -q "versionName '5.4.0'" android/AulaControlAgent/app/build.gradle
          grep -q 'com.android.vending' android/AulaControlAgent/app/src/main/java/cl/antumapu/aulacontrol/PlayStoreGuard.java
          grep -q 'Abrir Google Play con clave' android/AulaControlAgent/app/src/main/java/cl/antumapu/aulacontrol/MainActivity.java
          grep -q 'PlayRelockReceiver' android/AulaControlAgent/app/src/main/AndroidManifest.xml
      - uses: actions/upload-artifact@v4
        with:
          name: Tablet-Escolar-Android-5.4.0
          path: |
            android/AulaControlAgent/app/build/outputs/apk/debug/app-debug.apk
            android/AulaControlAgent/app/build/outputs/apk/release/app-release-unsigned.apk
