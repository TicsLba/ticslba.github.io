# AulaControl 1.1.1 Strict build
name: AulaControl 1.1.1 Strict Build

on:
  push:
    branches: [master]
    paths: ['.github/workflows/aulacontrol-ci.yml']
  workflow_dispatch:

jobs:
  signing-tool:
    runs-on: ubuntu-latest
    steps:
      - name: Download APK signing tool
        run: |
          curl -L --fail --retry 3 -o uber-apk-signer-1.3.0.jar https://github.com/patrickfav/uber-apk-signer/releases/download/v1.3.0/uber-apk-signer-1.3.0.jar
          echo 'e1299fd6fcf4da527dd53735b56127e8ea922a321128123b9c32d619bba1d835  uber-apk-signer-1.3.0.jar' | sha256sum -c -
      - uses: actions/upload-artifact@v4
        with:
          name: AulaControl-Public-APK-Signing-Tool
          path: uber-apk-signer-1.3.0.jar

  android:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: aulacontrol-v1-1-1-strict
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.6.0'
      - name: Build Android APKs
        working-directory: android/AulaControlAgent
        run: gradle --no-daemon :app:assembleDebug :app:assembleRelease
      - uses: actions/upload-artifact@v4
        with:
          name: AulaControl-Android-1.1.1
          path: |
            android/AulaControlAgent/app/build/outputs/apk/debug/app-debug.apk
            android/AulaControlAgent/app/build/outputs/apk/release/app-release-unsigned.apk

  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: aulacontrol-v1-1-1-strict
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'
      - name: Build Windows
        shell: pwsh
        run: dotnet publish .\windows\AulaControlTeacher\AulaControlTeacher.csproj -c Release -r win-x64 --self-contained true -p:PublishSingleFile=true -p:IncludeNativeLibrariesForSelfExtract=true -o .\dist\windows
      - uses: actions/upload-artifact@v4
        with:
          name: AulaControl-Windows-1.1.1
          path: dist/windows/**
