name: Build Antumapu Guard v3

on:
  push:
    branches:
      - chatgpt-antumapu-guard-v3-build
    paths:
      - 'antumapu-guard-v3/**'
      - '.github/workflows/build-antumapu-guard-v3.yml'

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android platform
        run: sdkmanager "platforms;android-35" "build-tools;35.0.0"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Build APK
        working-directory: antumapu-guard-v3
        run: gradle :app:assembleDebug --stacktrace

      - name: Rename APK
        run: cp antumapu-guard-v3/app/build/outputs/apk/debug/app-debug.apk AntumapuGuard-v3.apk

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: AntumapuGuard-v3-APK
          path: AntumapuGuard-v3.apk
          retention-days: 7
