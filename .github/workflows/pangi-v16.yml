name: PANGI V16 Android

on:
  workflow_dispatch:
  push:
    branches:
      - pangi-v16
    paths:
      - 'pangi-v16/android/**'
      - '.github/workflows/pangi-v16.yml'

jobs:
  android:
    name: Build PANGI V16 Agent
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.10.2'

      - name: Verify Android SDK
        shell: bash
        run: |
          echo "ANDROID_HOME=$ANDROID_HOME"
          test -d "$ANDROID_HOME"

      - name: Build release APK
        working-directory: pangi-v16/android/PangiAgent
        run: gradle :app:assembleRelease --stacktrace

      - name: Upload unsigned APK
        uses: actions/upload-artifact@v4
        with:
          name: PANGI-V16-Alpha1-Android-unsigned
          path: pangi-v16/android/PangiAgent/app/build/outputs/apk/release/app-release-unsigned.apk
          if-no-files-found: error
